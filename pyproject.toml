[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-stremio"
version = "0.1.0"
description = "Terminal-based video download manager for legal content from local folder structure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
cloudflare = [
    "tls_client>=1.0.0",
    "cloudscraper>=1.2.71",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
py-stremio = "py_stremio.main:run"
py-stremio-cron = "py_stremio.main:run_cron"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["py_stremio"]

[tool.hatch.build.targets.sdist]
include = ["py_stremio"]
